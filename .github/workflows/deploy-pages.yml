# Deploys the committed reports/ (draft research review + status dashboard) to
# GitHub Pages. The HTML files are self-contained build artifacts produced
# locally by `node scripts/build-checker.js` and `node scripts/report.js`.
#
# Deliberately NO rebuild step: the research dataset in this repository is
# pending senior review, so Pages always publishes exactly the committed,
# verified build. When a rebuilt set is committed, this workflow publishes it
# on the next push.
name: Deploy research pages

on:
  push:
    branches: [main]
    paths:
      - "reports/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
